version: '3.9'

services:
  ros1-noetic:
    image: ros-noetic-image
    container_name: ros-noetic-container
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER: ${USER}
    stdin_open: true
    tty: true
    volumes:
      - "/etc/group:/etc/group:ro"
      - "/etc/passwd:/etc/passwd:ro"
      - "/etc/shadow:/etc/shadow:ro"
      - "/etc/sudoers.d:/etc/sudoers.d:ro"
      - "~:/home/${USER}/host"
    environment:
      - DISPLAY=${DISPLAY}
      # - LIBGL_ALWAYS_SOFTWARE=1 # Uncomment if you want to use software rendering (No GPU)
    network_mode: host
    ipc: host
    user: "${USER}:${USER}"
    # Comment the following lines if you want to use Nvidia GPU
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all # alternatively, use `count: all` for all GPUs
              capabilities: [gpu]

